<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Biometrics Force-Directed Graph</title>
  <style>
    :root {
      --bg: transparent;
      --panel: transparent;
      --text: #1f2937;
      --muted: #6b7280;
      --tooltip-bg: rgba(17, 24, 39, 0.95);
      --tooltip-text: #f9fafb;
      --border: #d1d5db;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      color: var(--text);
      font-family: "Avenir Next", "Segoe UI", sans-serif;
    }

    .wrap {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
    }

    #chart {
      width: 100%;
      height: 100%;
      background: var(--panel);
      border: 0;
      border-radius: 0;
      box-shadow: none;
      overflow: hidden;
    }

    .tooltip {
      position: absolute;
      pointer-events: none;
      z-index: 10;
      opacity: 0;
      background: var(--tooltip-bg);
      color: var(--tooltip-text);
      border-radius: 8px;
      padding: 10px 12px;
      max-width: 340px;
      font-size: 12px;
      line-height: 1.4;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
      transition: opacity 0.15s ease;
      white-space: normal;
    }

    .legend {
      display: none;
      flex-wrap: wrap;
      gap: 8px 12px;
      margin: 12px 0 0;
      font-size: 12px;
      color: var(--muted);
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 8px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: #fff;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }

  </style>
</head>
<body>
  <div class="wrap">
    <div id="chart"></div>
    <div class="legend">
      <span class="legend-item"><span class="dot" style="background:#111827"></span> Case nodes</span>
      <span class="legend-item"><span class="dot" style="background:#374151"></span> AI classification nodes</span>
      <span class="legend-item"><span class="dot" style="background:#6b7280"></span> Harm nodes</span>
    </div>
    <div id="biometric-legend" class="legend" aria-label="Biometric color legend"></div>
  </div>

  <div id="tooltip" class="tooltip" aria-hidden="true"></div>

  <script src="./vendor/d3.v7.min.js"></script>
  <script>
    async function main() {
      const raw = await d3.json("./Final_AI_Biometrics.json");

      const clean = raw.map((d) => {
        const nr = (d["Nr."] || "").toString().trim();
        const biometric = (d["Biometric Analysis"] || "Unspecified").toString().trim() || "Unspecified";
        const aiClassification = (d["AI Classification"] || "Unclassified").toString().trim() || "Unclassified";
        const harm = (d["Harm"] || "Unclear or systemic harm").toString().trim() || "Unclear or systemic harm";
        const incident = (d["Incident"] || "No incident title").toString().trim() || "No incident title";
        const description = (d["Description"] || "No description").toString().trim() || "No description";
        const date = (d["date"] || "Unknown").toString().trim() || "Unknown";

        return {
          nr,
          biometric,
          aiClassification,
          harm,
          incident,
          description,
          date
        };
      }).filter((d) => d.nr !== "");

      const linksCount = new Map();
      const nodesMap = new Map();
      const aiCaseCounts = new Map();
      const harmCaseCounts = new Map();

      function addNode(node) {
        if (!nodesMap.has(node.id)) {
          nodesMap.set(node.id, node);
          return;
        }
        Object.assign(nodesMap.get(node.id), node);
      }

      function addCountedLink(source, target) {
        const key = source + "|||" + target;
        const current = linksCount.get(key) || 0;
        linksCount.set(key, current + 1);
      }

      clean.forEach((d) => {
        const caseId = "Case " + d.nr;
        const aiId = d.biometric + " | AI: " + d.aiClassification;
        const harmId = d.biometric + " | Harm: " + d.harm;

        aiCaseCounts.set(aiId, (aiCaseCounts.get(aiId) || 0) + 1);
        harmCaseCounts.set(harmId, (harmCaseCounts.get(harmId) || 0) + 1);

        addNode({
          id: caseId,
          label: caseId,
          group: d.biometric,
          layer: "case",
          nr: d.nr,
          incident: d.incident,
          description: d.description,
          date: d.date,
          aiClassification: d.aiClassification,
          harm: d.harm
        });

        addNode({
          id: aiId,
          label: d.aiClassification,
          group: d.biometric,
          layer: "ai",
          caseCount: aiCaseCounts.get(aiId)
        });

        addNode({
          id: harmId,
          label: d.harm,
          group: d.biometric,
          layer: "harm",
          caseCount: harmCaseCounts.get(harmId)
        });

        addCountedLink(caseId, aiId);
        addCountedLink(aiId, harmId);
      });

      const data = {
        nodes: Array.from(nodesMap.values()),
        links: Array.from(linksCount.entries()).map(([k, value]) => {
          const parts = k.split("|||");
          return { source: parts[0], target: parts[1], value };
        })
      };

      const biometricTypes = Array.from(new Set(clean.map((d) => d.biometric))).sort((a, b) => a.localeCompare(b));
      const color = d3.scaleOrdinal(d3.schemeCategory10).domain(biometricTypes);

      // Keep Observable-style invalidation hook in browser context.
      const invalidation = new Promise((resolve) => {
        window.addEventListener("beforeunload", resolve, { once: true });
      });

      const chart = (() => {
        // Specify the dimensions of the chart.
        const width = 1441;
        const height = 982;

        // The force simulation mutates links and nodes, so create a copy
        // so that re-evaluating this cell produces the same result.
        const links = data.links.map(d => ({...d}));
        const nodes = data.nodes.map(d => ({...d}));

        function nodeRadius(d) {
          return d.layer === "case" ? 7 : d.layer === "ai" ? 6 : 5;
        }

        function clamp(value, min, max) {
          return Math.max(min, Math.min(max, value));
        }

        const layerCenters = {
          case: width * 0.2,
          ai: width * 0.5,
          harm: width * 0.8
        };



        // Create a simulation with several forces.
        const simulation = d3.forceSimulation(nodes)
            .force("link", d3.forceLink(links).id(d => d.id).distance(42))
            .force("charge", d3.forceManyBody().strength(-28))
            .force("center", d3.forceCenter(width / 2, height / 2))
            .force("x", d3.forceX((d) => d.layer === "case" ? layerCenters.case : d.layer === "ai" ? layerCenters.ai : layerCenters.harm).strength(0.55))
          .force("y", d3.forceY((d) => {
            if (d.layer === "case") return height * 0.5;
            if (d.layer === "ai") return height * 0.42;
            return height * 0.58;
          }).strength(0.08))
          .force("collide", d3.forceCollide().radius((d) => nodeRadius(d) + 1))
            .on("tick", ticked);

        // Create the SVG container.
        const svg = d3.create("svg")
            .attr("width", width)
            .attr("height", height)
            .attr("viewBox", [0, 0, width, height])
          .attr("style", "width: 100%; height: 100%; display: block;");

        // Add a line for each link, and a circle for each node.
        const link = svg.append("g")
            .attr("stroke", "#999")
            .attr("stroke-opacity", 0.6)
          .selectAll()
          .data(links)
          .join("line")
            .attr("stroke", (d) => d.source.layer === "case" ? "#2563eb" : "#d97706")
            .attr("stroke-opacity", (d) => d.source.layer === "case" ? 0.4 : 0.65)
            .attr("stroke-width", d => Math.max(0.6, Math.sqrt(d.value) * 0.45));

        const node = svg.append("g")
            .attr("stroke", "#fff")
            .attr("stroke-width", 1.5)
          .selectAll()
          .data(nodes)
          .join("circle")
            .attr("r", (d) => nodeRadius(d))
            .attr("fill", d => d.layer === "case" ? color(d.group) : d.layer === "ai" ? "#0f766e" : "#b45309");

        node.append("title")
            .text(d => d.layer === "case" ? `${d.id} (${d.group})` : `${d.label} (${d.group})`);

        // Add a drag behavior.
        node.call(d3.drag()
              .on("start", dragstarted)
              .on("drag", dragged)
              .on("end", dragended));

        // Set the position attributes of links and nodes each time the simulation ticks.
        function ticked() {
          nodes.forEach((d) => {
            const r = nodeRadius(d);
            d.x = clamp(d.x, r, width - r);
            d.y = clamp(d.y, r, height - r);
          });

          link
              .attr("x1", d => d.source.x)
              .attr("y1", d => d.source.y)
              .attr("x2", d => d.target.x)
              .attr("y2", d => d.target.y);

          node
              .attr("cx", d => d.x)
              .attr("cy", d => d.y);
        }

        // Reheat the simulation when drag starts, and fix the subject position.
        function dragstarted(event) {
          if (!event.active) simulation.alphaTarget(0.3).restart();
          event.subject.fx = event.subject.x;
          event.subject.fy = event.subject.y;
        }

        // Update the subject (dragged node) position during drag.
        function dragged(event) {
          const r = nodeRadius(event.subject);
          event.subject.fx = clamp(event.x, r, width - r);
          event.subject.fy = clamp(event.y, r, height - r);
        }

        // Restore the target alpha so the simulation cools after dragging ends.
        // Unfix the subject position now that it’s no longer being dragged.
        function dragended(event) {
          if (!event.active) simulation.alphaTarget(0);
          event.subject.fx = null;
          event.subject.fy = null;
        }

        // When this cell is re-run, stop the previous simulation. (This doesn’t
        // really matter since the target alpha is zero and the simulation will
        // stop naturally, but it’s a good practice.)
        invalidation.then(() => simulation.stop());

        return svg.node();
      })();

      const chartHost = document.getElementById("chart");
      chartHost.appendChild(chart);

      const biometricLegend = d3.select("#biometric-legend");
      biometricLegend.selectAll("span")
        .data(biometricTypes)
        .join("span")
          .attr("class", "legend-item")
          .html((biometric) =>
            "<span class=\"dot\" style=\"background:" + color(biometric) + "\"></span>" +
            biometric
          );

      const tooltip = d3.select("#tooltip");
      d3.select(chart)
        .selectAll("circle")
        .on("mouseover", function(event, d) {
          let tooltipHtml = "";
          if (d.layer === "case") {
            tooltipHtml =
              "<strong>Case " + d.nr + "</strong><br>" +
              "<strong>Incident:</strong> " + d.incident + "<br>" +
              "<strong>Description:</strong> " + d.description + "<br>" +
              "<strong>Date:</strong> " + d.date;
          } else if (d.layer === "ai") {
            tooltipHtml =
              "<strong>AI Classification</strong><br>" +
              d.label + "<br>" +
              "<strong>Related Cases:</strong> " + (d.caseCount || 0);
          } else {
            tooltipHtml =
              "<strong>Harm</strong><br>" +
              d.label + "<br>" +
              "<strong>Related Cases:</strong> " + (d.caseCount || 0);
          }

          tooltip
            .style("opacity", 1)
            .attr("aria-hidden", "false")
            .html(tooltipHtml);
        })
        .on("mousemove", function(event) {
          tooltip
            .style("left", (event.pageX + 14) + "px")
            .style("top", (event.pageY + 14) + "px");
        })
        .on("mouseout", function() {
          tooltip
            .style("opacity", 0)
            .attr("aria-hidden", "true");
        });
    }

    main();
  </script>
</body>
</html>
